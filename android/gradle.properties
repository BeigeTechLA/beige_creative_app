org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 legacy-compat mode (AGP9_UPGRADE.md Phase 2). Keeps the legacy Kotlin
# Gradle Plugin + pre-AGP9 DSL so existing plugins build unchanged. Flip both
# to true in Phase 3 to adopt AGP's built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
