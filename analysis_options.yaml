# Static analysis config — applies to `flutter analyze` (CLI + IDE).
#
# Base set: `package:flutter_lints/flutter.yaml` (Flutter team recommended,
# pinned via `flutter_lints: ^6.0.0` in `pubspec.yaml`).
# Project-specific overrides live in the `linter.rules` block below.
#
# CI runs `flutter analyze --fatal-infos` (Phase 5.05, 2026-05-31), so any
# info-level lint blocks merge. To suppress a single occurrence:
# `// ignore: <rule>` (single line) or `// ignore_for_file: <rule>` (whole
# file) with a `— reason: …` comment per `MIGRATION_RULES.md` §10.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Permanently disabled (5.07 review): asset filenames + API endpoint paths
    # mirror server-side snake_case keys (e.g. `upload_resume`,
    # `delete_allfiles`, `image_holder.svg`). Renaming the Dart constants
    # decouples them from their source-of-truth and adds zero clarity. Lint
    # off rather than per-line ignore noise.
    constant_identifier_names: false
